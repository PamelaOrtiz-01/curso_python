<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Movie Database</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/movie_styles.css') }}">
</head>
<body>
    <h1>My Movie Database</h1>
    <div><a href="{{ url_for('movies') }}">View Movies</a></div>
    <div><a href="{{ url_for('stars') }}">View Stars</a></div>
    <ul>
        {% for movie in rows %}
            <li>
                {% if movie.poster_url %}
                <a href="{{ url_for('movie_detail', movie_id=movie.id) }}">
                    <img src="{{ movie.poster_url }}" alt="{{ movie.movie_title }} poster" width="100">
                </a>
                {% endif %}
                <span>{{ movie.movie_title }} ({{ movie.release_date }})</span>
            </li>
        {% endfor %}    
    </ul>
        <ul>
        {% for star in rows %}
            <li>
                {% if star.image_url %}
                <a href="{{ url_for('star_detail', star_id=star.id) }}">
                    <img src="{{ star.image_url }}" alt="{{ star.stage_name }} profile" width="100">
                </a>
                {% endif %}
                <span>{{ star.stage_name }}</span>
            </li>
        {% endfor %}    
    </ul>
</body>
</html>
</html>
</html>
